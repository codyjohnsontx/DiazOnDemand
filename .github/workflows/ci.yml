name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    # Two suites run against a real database on purpose: the resubscribe and
    # double-checkout defects were unique-constraint violations, and the Mux
    # awaiting-playback state was refused by a CHECK constraint - neither of
    # which a mocked Prisma client can raise. See the Tests section of README.md.
    services:
      postgres:
        # Pinned by digest so a silent upstream retag cannot change what the
        # database-backed tests run against. This is postgres:16-alpine.
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diaz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diaz_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The deploy gate, in both directions, against the database this job already
      # has. Its only failure mode is silence - a gate that stopped refusing looks
      # exactly like a gate with nothing to refuse - so something has to assert that
      # it still says no. The service container is unmigrated until the next step,
      # which is the state that shipped the P2022 incident it exists for.
      #
      # A non-zero exit is not enough on its own: the gate refuses an unverifiable
      # database too, so a broken pending-name parser would still exit 1 here and
      # still pass the step after. What the incident actually cost was the remedy,
      # so the refusal has to name a pending migration and still carry the
      # direct-connection trap. All seven are pending against an empty database.
      - name: Deploy gate refuses a behind database
        run: |
          if out=$(pnpm db:check 2>&1); then
            echo "$out"
            echo "db:check passed against an unmigrated database - the gate is not gating"
            exit 1
          fi
          echo "$out"
          if ! grep -q '20260901090000_lesson_mux_awaiting_playback' <<<"$out"; then
            echo "the refusal did not name the pending migrations"
            exit 1
          fi
          if ! grep -q 'DIRECT connection' <<<"$out"; then
            echo "the refusal did not carry the direct-connection remedy"
            exit 1
          fi
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Apply database migrations
        run: pnpm --filter @diaz/db exec prisma migrate deploy --schema prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Deploy gate passes an up-to-date database
        run: pnpm db:check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: pnpm test
