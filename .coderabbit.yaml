# CodeRabbit configuration
#
# Goal: keep the full review quality Cody values, while cutting the number of
# review runs and the amount of noise each one has to chew through.
#
# Schema confirmed against docs.coderabbit.ai. Defaults noted so it is obvious
# what is actually being changed and what is just written down for clarity.

reviews:
  # Already the default. Stated explicitly so nobody "tunes" it to assertive
  # later and wonders where the noise came from.
  profile: chill

  auto_review:
    enabled: true

    # THE ONE THAT MATTERS.
    # Default is true: CodeRabbit re-reviews as new commits land. Our workflow
    # pushes fix rounds after the first review, so that spends a second review
    # on a pull request we are still working on.
    # With this off, CodeRabbit reviews once, and re-reviews only when asked
    # with `@coderabbitai review`. Same review, requested when the branch is
    # actually ready.
    auto_incremental_review: false

    # Already the default. Draft pull requests are not reviewed, which is what
    # makes "open early as a draft" safe if we ever want it.
    drafts: false

  # Skip what nobody should be reviewing. Every one of these is generated,
  # vendored, or binary - reviewing them costs quota and returns nothing.
  #
  # The rule to carry away from this file, because it has been read wrong here
  # before: absence from an exclusion list is not inclusion. CodeRabbit ships
  # its own built-in skip list, and anything on it stays skipped. Do not guess
  # at what is on it, in either direction - it is published in full, 137
  # patterns under "Default ignored paths" at
  # https://docs.coderabbit.ai/configuration/path-instructions. Ordinary source
  # and markdown are not on it; they are reviewed by default and are simply not
  # excluded here, which is why they need no include (today's most useful
  # comments were on markdown, and that is worth paying for).
  #
  # And the harder rule, which cost this repository a day of unreviewed merges:
  # THERE IS NO SAFE WAY TO ADD AN INCLUDE HERE. Every entry below starts with
  # `!`, and the next one has to as well. See the block above the list.
  path_filters:
    # DO NOT ADD AN ENTRY WITHOUT A LEADING `!`. Read this before you try.
    #
    # An entry without `!` is an INCLUDE, and a single include NARROWS the whole
    # review to only what it matches. Everything else is then skipped with
    # "excluded by none and included by none" - skipped not because something
    # excludes it but because nothing includes it. An earlier version of this
    # file asserted the opposite ("mixing includes and excludes does not narrow
    # the review to only these paths") and carried four includes. That assertion
    # was false, and it is why nothing here except two Prisma paths was reviewed
    # between 2026-08-03 00:50Z and this change.
    #
    # CodeRabbit's skip message offers what looks like an escape hatch, and it
    # does not work. It says an include naming a path on the built-in skip list
    # is applied "by removing the pattern from both the lists", which would make
    # such an include cancel the block without narrowing anything. That was
    # tested directly, on this file, and it is not what happens.
    #
    # VERIFIED by experiment, each one a throwaway pull request holding a single
    # file, judged in `/pulls/<n>/reviews` and never in the bot's reply:
    #   - four includes present, one plain `.ts` file: SKIPPED, "included by
    #     none". One `.svg` file, itself force-included: SKIPPED too.
    #   - only the two block-override includes `pnpm-lock.yaml` and `**/*.svg`
    #     present, one plain `.ts` file: STILL SKIPPED (PR #13). So at least one
    #     block-override include survives as a narrowing include. The documented
    #     "removed from both lists" behaviour did not hold here.
    #   - no includes at all, the list as it stands now, one plain `.ts` file:
    #     REVIEWED (PR #14). That is the state this file is in and the only
    #     arrangement observed to review ordinary source.
    # Config is read from the pull request HEAD branch, not the base - verified
    # on PR #13, where `@coderabbitai configuration` echoed back the head
    # branch's path_filters while `main` still had the old ones. So a change
    # here can and should be tested in its own pull request before merging.
    #
    # KNOWN COST OF THIS ARRANGEMENT, accepted deliberately, not overlooked:
    # `pnpm-lock.yaml` and `**/*.svg` are on CodeRabbit's built-in skip list and
    # are therefore NOT reviewed. Both were argued for at length in the version
    # of this file that introduced the includes, and both arguments still stand:
    # the lockfile is where a supply-chain problem first shows up (a new
    # transitive dependency, a changed integrity hash, a rewritten registry URL)
    # and it is the input CodeRabbit's dependency-vulnerability scanning reads;
    # an SVG is text that can carry executable content (inline <script>, on*
    # handlers, `javascript:` hrefs) once it is inlined into the web app rather
    # than served through an <img>. Neither is worth buying at the price of
    # every other file in the repository, which is the only price on offer.
    # Cover them another way - a dependency-review action for the lockfile,
    # human eyes on the first SVG that lands - not with an include here.
    # UNTESTED HYPOTHESIS, recorded so nobody has to re-derive it: `**/*.svg`
    # alone may behave as documented and cancel its block without narrowing,
    # since the earlier `.svg` experiment showed it being consumed. The likelier
    # survivor in PR #13 is `pnpm-lock.yaml`, written as a bare path where the
    # built-in pattern is `**/pnpm-lock.yaml`. Nobody has run that experiment.
    # If you run it, run it exactly as above and believe only the reviews list.
    #
    # Prisma migrations and the schema used to be pinned here as
    # `packages/db/prisma/migrations/**/*.sql` and
    # `packages/db/prisma/schema.prisma`. Do not put them back. They are NOT on
    # the built-in skip list - nothing on it matches `.sql`, `schema.prisma`, or
    # a `migrations/` directory, since its generated-code entries are directory
    # names (`generated/`, `gen/`, and variants) plus a `*.generated.*` suffix,
    # and none of those hit these paths. They are reviewed by default, so those
    # includes restored nothing and cost the review of everything else. A
    # migration is still the highest-risk change in this repo (see the Database
    # Safety rules in CLAUDE.md) and is still reviewed - by default, which is
    # the only way to have it reviewed without switching off the rest.
    # Tracked today: apps/diaz-ondemand-web/tsconfig.tsbuildinfo
    - '!**/*.tsbuildinfo'
    # Prisma writes this; it is not hand-edited.
    - '!**/prisma/migrations/migration_lock.toml'
    # Build output. Gitignored today, so these are cheap insurance against a
    # stray `git add -f` rather than a live problem.
    # `dist` and `build` match at any depth, the same way .gitignore and the
    # turbo.json `outputs` globs treat them, so they would also hide a source
    # directory that happened to take one of those names (a `src/build/`
    # module). Nothing tracked collides today; revisit these two if one ever
    # does, because hiding real source is the failure this file exists to avoid.
    - '!**/dist/**'
    - '!**/build/**'
    - '!**/.next/**'
    - '!**/coverage/**'
    # Turborepo and Expo caches - both toolchains are in use here (turbo.json,
    # apps/mobile), and neither generic build-output glob above covers them.
    - '!**/.turbo/**'
    - '!**/.expo/**'
    # Raster images. None are tracked yet, kept because a web and mobile
    # product will grow them and there is nothing to review in a binary
    # image diff.
    # SVG is absent from this group because there is no point excluding what is
    # already blocked: `**/*.svg` is on CodeRabbit's built-in skip list, so SVG
    # is unreviewed today whatever this group says. That is a real gap, not a
    # preference - an SVG is text, it diffs readably, and when inlined into the
    # web app rather than served through an <img> it can carry executable
    # content (inline <script>, on* handlers, javascript: hrefs), so an
    # unreviewed SVG is a script that looks like a picture. Zero are tracked
    # today. The include that used to cover it had to go; see the note at the
    # top of this list for why and for what to do instead.
    - '!**/*.png'
    - '!**/*.jpg'
    - '!**/*.jpeg'
    - '!**/*.gif'
    - '!**/*.webp'
    - '!**/*.ico'

  # Keep. This is the summary Cody actually reads.
  high_level_summary: true

  # Keep. The status line is how we tell a finished review from a running one.
  review_status: true

  poem: false
